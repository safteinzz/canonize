[package]
name = "canonize"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "bring your rules to any coding agent - one canon of rules, house files and skills for the agents you use"
authors = ["Pablo Antonio Hernández Hernández (safteinzz)"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://gitlab.com/safteinzz/canonize"
keywords = ["ai", "agents", "claude", "codex", "tui"]
categories = ["command-line-utilities", "development-tools"]
# README pictures are fetched over the network by crates.io from absolute raw
# URLs, never read out of the package. CANON.md and CLAUDE.md are this repo's
# own agent wiring and name files that live outside it.
exclude = ["readme-assets/", "demo/", "CANON.md", "CLAUDE.md"]

# The crate is `canonize`, but the command you type is `canon`.
[[bin]]
name = "canon"
path = "src/main.rs"

[dependencies]
anyhow     = "1"                                        # error handling in the engines
clap       = { version = "4", features = ["derive"] }  # CLI argument parsing
ratatui    = "0.29"                                     # the TUI (bare `canon`)
crossterm  = "0.28"                                     # terminal backend for ratatui + key events
colored    = "2"                                        # colored CLI output
dirs       = "5"                                        # locate the home and config dirs portably
serde      = { version = "1", features = ["derive"] }  # config and rules parsing
toml       = "0.8"                                      # canonize.toml
serde_yaml = "0.9"                                      # the rules file
serde_json = "1"                                        # the rules schema
jsonschema = { version = "0.33", default-features = false }  # validating the rules file, no network resolver

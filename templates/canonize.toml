# canonize.toml: where the pieces of your canon are, and which agents it
# reaches. `canon` reads it on every start; in the dashboard, E opens it here.
#
# A value in quotes is text: "rules.yaml". A list goes in square brackets,
# each item in quotes and separated by commas: ["~/dev", "~/work"]. A line
# starting with # is a note and is ignored.

# Folders to look through for projects (anything with a CLAUDE.md,
# .claude/CLAUDE.md, AGENTS.md, AGENTS.override.md, CLAUDE.local.md or
# CANON.md, up to three levels down). [] looks nowhere.
projects = {projects}

[source]
# Every path here is inside this folder unless it starts with ~ or /.

# The rules every agent follows.
rules  = "{rules}"
# The schema `canon validate` holds the rules to. "" for none.
schema = "{schema}"
# Your conventions, files an agent reads for one kind of work: one * allowed
# in the file name. "" for none.
conventions = "{house}"
# The folder holding one folder per skill, each with a SKILL.md.
skills = "{skills}"
# Your MCP servers, one table each (see `canon --help`). "" for none.
mcp    = "mcp.toml"

# Folders you work in outside the repos of your projects (notes, replies, data,
# a folder per issue), each pointed at the projects it is for, one path or a
# list: an agent started anywhere under one is told about them and reads their
# files. `canon link` adds one.
[workspaces]

# Every agent canonize knows (claude, codex, pi, opencode) comes with its own
# paths. To change one, remove the # in front of its lines and edit them:
#
# [agents.claude]
# rules       = "~/.claude/CLAUDE.md"
# rules_mode  = "import"         # import | link | off
# skills      = "~/.claude/skills"
# skills_mode = "per-skill"      # per-skill | folder | off
#
# To leave an agent out without deleting anything:
# [agents.codex]
# enabled = false
#
# An agent canonize does not know needs its home, rules and skills:
# [agents.myagent]
# home        = "~/.myagent"
# rules       = "~/.myagent/AGENTS.md"
# rules_mode  = "link"
# skills      = "~/.myagent/skills"
# skills_mode = "folder"
